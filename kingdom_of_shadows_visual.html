<style>

ent:space-between;align-items:center;gap:8px}.tag{border:1px solid #655333;border-radius:20px;padding:3px 8px;color:var(--gold2);font-size:11px}.choice{width:100%;text-align:left;margin:5px 0}.choice span{display:block;color:var(--muted);font-size:12px}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:700px){.wrap{padding:12px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:1fr}.banner{min-height:160px}.stat strong{font-size:18px}.panel{padding:13px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){.actions{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body><div class="wrap">
<header class="top"><div><div class="eyebrow">A realm of choices · A legacy of blood</div><div class="brand">KINGDOM <span style="color:#777b8c">OF</span> SHADOWS</div></div><button id="saveBtn" title="Simpan permainan">💾 Simpan</button></header>
<div id="game">

<section class="kingdom-hero">
  <div class="hero-shade"></div>
  <div class="hero-top"><div class="crest">🐺</div><div><div class="eyebrow">TAKHTA VEYR · TAHUN PERTAMA</div><h1>Kerajaan di Ambang Zaman</h1><p>Bangun kekuatanmu. Pilih sekutumu. Tentukan takdirmu.</p></div></div>
  <div class="hero-bottom"><div class="hero-badge"><span>♜</span><div><b>Kastil Veyr</b><small>Level kerajaan <strong id="heroLevel">1</strong></small></div></div><button class="hero-action" onclick="gameAction('tick')">Akhiri Hari <span>➜</span></button></div>
</section>
<div class="stats" id="stats"></div>
<nav class="tabs" id="tabs">
<button data-tab="realm" class="active">♜ Kerajaan</button><button data-tab="map">🗺 Wilayah</button><button data-tab="court">♛ Dewan</button><button data-tab="quests">✦ Misi</button><button data-tab="chronicle">📜 Kronik</button>
</nav>
<section id="view"></section>
</div>
<div class="footer">KINGDOM OF SHADOWS · Setiap pilihan meninggalkan bayangan.</div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const initial=()=>({day:1,turn:1,king:"Aldric",realm:"Veyr",title:"Penjaga Takhta",gold:120,food:90,wood:65,iron:35,faith:45,army:55,stability:65,knowledge:0,renown:0,shadow:0,level:1,xp:0,buildings:{keep:1,farms:1,barracks:1,library:0,spy:0,market:0},territories:["Veyr"],relations:{Cinderfall:0,Silvermere:0,Thornwatch:0,"Ember Coast":0},flags:{},quests:[],completed:[],events:[],log:[],ending:null,secretClues:0});
let S;
const names=["Cinderfall","Silvermere","Thornwatch","Ember Coast","The Hollow March","Frostgate","Duskmoor"];
const regions={
"Cinderfall":{desc:"Kadipaten tambang besi dan para pandai senjata.",cost:{gold:70,army:12},yield:"iron",difficulty:1},
"Silvermere":{desc:"Danau suci, biara tua, dan pusat pengaruh para rohaniwan.",cost:{gold:65,faith:8},yield:"faith",difficulty:1},
"Thornwatch":{desc:"Benteng perbatasan yang menjaga jalur hutan utara.",cost:{gold:80,army:18},yield:"wood",difficulty:2},
"Ember Coast":{desc:"Pelabuhan kaya yang menguasai perdagangan garam dan rempah.",cost:{gold:100,army:15},yield:"gold",difficulty:2},
"The Hollow March":{desc:"Rawa berkabut tempat nama-nama lama dibisikkan.",cost:{gold:110,army:22},yield:"shadow",difficulty:3},
"Frostgate":{desc:"Gerbang pegunungan yang tak pernah tunduk pada musim.",cost:{gold:125,army:28},yield:"iron",difficulty:3},
"Duskmoor":{desc:"Tanah terlarang yang hilang dari semua peta kerajaan.",cost:{gold:1,army:1},yield:"secret",difficulty:4}
};
const questDefs=[
{id:"bread",title:"Roti untuk Rakyat",desc:"Persediaan pangan menipis di distrik selatan.",goal:"Berikan 20 emas untuk membeli gandum.",check:()=>S.flags.bread,secret:false},
{id:"whisper",title:"Bisikan di Balik Tirai",desc:"Seorang pelayan mengaku mendengar percakapan rahasia di ruang bawah tanah.",goal:"Bangun jaringan mata-mata untuk menyelidiki.",check:()=>S.buildings.spy>0,secret:true},
{id:"oldscript",title:"Naskah yang Terlupakan",desc:"Fragmen naskah kuno ditemukan di perpustakaan.",goal:"Bangun perpustakaan dan pelajari satu pengetahuan.",check:()=>S.knowledge>0,secret:true},
{id:"unity",title:"Sumpah Tujuh Panji",desc:"Takhta membutuhkan sekutu sebelum perang berikutnya.",goal:"Jalin hubungan baik dengan dua wilayah.",check:()=>Object.values(S.relations).filter(x=>x>=2).length>=2,secret:false},
{id:"crown",title:"Mahkota di Balik Kabut",desc:"Legenda berkata bahwa penguasa sejati harus menghadapi bayangan yang diwarisinya.",goal:"Temukan tiga petunjuk rahasia.",check:()=>S.secretClues>=3,secret:true}
];
const rand=n=>Math.floor(Math.random()*n);
const has=(k,n=1)=>S[k]>=n;
function log(t,type=""){S.log.unshift({day:S.day,text:t,type});S.log=S.log.slice(0,60)}
function add(k,n){S[k]=Math.max(0,(S[k]||0)+n)}
function costOK(c){return Object.entries(c).every(([k,v])=>S[k]>=v)}
function pay(c){Object.entries(c).forEach(([k,v])=>add(k,-v))}
function costText(c){return Object.entries(c).map(([k,v])=>`${v} ${({gold:"emas",food:"pangan",wood:"kayu",iron:"besi",faith:"iman",army:"pasukan"})[k]||k}`).join(" · ")}
function toast(t){let el=$("#toast");el.textContent=t;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2200)}
function save(){localStorage.setItem("kos_save_v1",JSON.stringify(S));toast("Permainan tersimpan di perangkat ini.")}
function load(){try{let d=JSON.parse(localStorage.getItem("kos_save_v1"));if(d&&d.day) return d}catch(e){}return null}
function modal(title,body,buttons=[]){$("#modalbox").innerHTML=`<div class="eyebrow">Kingdom of Shadows</div><h2>${title}</h2><div>${body}</div><div style="display:grid;gap:7px;margin-top:18px">${buttons.map((b,i)=>`<button class="${b.cls||""}" data-modal="${i}">${b.label}</button>`).join("")}</div>`;$("#modal").classList.remove("hidden");$("#modalbox").querySelectorAll("[data-modal]").forEach(el=>el.onclick=()=>{let b=buttons[+el.dataset.modal];if(b.fn)b.fn();$("#modal").classList.add("hidden");render()})}
function intro(){modal("Takhta yang Retak",`<p>Di kerajaan Veyr, Raja tua meninggal tanpa pewaris yang disepakati. Para bangsawan tersenyum di aula, sementara pisau-pisau telah terhunus di balik jubah.</p><p>Kau adalah <b>Aldric</b>, penjaga takhta yang kini harus menentukan apakah kerajaan akan tumbuh melalui diplomasi, kekuatan, atau rahasia.</p><p class="gold">Ingat: kemenangan bukan selalu tentang siapa yang duduk di takhta—tetapi apa yang tersisa setelahnya.</p>`,[{label:"Mulai kisah",cls:"primary",fn:()=>{S.flags.started=true;log("Kau menerima segel kerajaan. Tujuh panji menunggu keputusanmu.");eventStory()}}])}
function storyEvent(title,text,choices){modal(title,`<p>${text}</p>`,choices.map(c=>({label:c.label,fn:()=>{c.fn();render()}})))}
function eventStory(){
if(!S.flags.started)return;
if(!S.flags.council){S.flags.council=true;storyEvent("Sidang Pertama","Lady Maerwynn dari Silvermere meminta subsidi bagi biara. Lord Kael dari Cinderfall menuntut dana untuk tambang. Kas kerajaan tak cukup untuk memuaskan keduanya.",[
{label:"Biayai biara (−25 emas, +12 iman)",fn:()=>{if(S.gold>=25){add("gold",-25);add("faith",12);S.relations.Silvermere+=1;log("Kau mendukung Silvermere. Para rohaniwan menyebutmu adil.","good")}else{add("stability",-4);log("Kas terlalu tipis untuk memenuhi permintaan biara.","bad")}}},
{label:"Biayai tambang (−25 emas, +12 besi)",fn:()=>{if(S.gold>=25){add("gold",-25);add("iron",12);S.relations.Cinderfall+=1;log("Kau mendukung Cinderfall. Bengkel kerajaan kembali menyala.","good")}else{add("stability",-4);log("Kas terlalu tipis untuk membantu tambang.","bad")}}},
{label:"Tolak keduanya (+4 stabilitas, +3 bayangan)",fn:()=>{add("stability",4);add("shadow",3);log("Kau menolak kedua tuntutan. Sebagian menyebutmu bijak, sebagian lain mulai berbisik.")}}
]);}
}
function tick(){
S.day++;S.turn++;
let foodIncome=S.territories.length*7+S.buildings.farms*8;
let goldIncome=12+S.buildings.market*9+Math.max(0,S.territories.length-1)*4;
add("food",foodIncome-7);add("gold",goldIncome);add("wood",3+S.territories.length*2);add("iron",2+S.territories.filter(t=>t==="Cinderfall"||t==="Frostgate").length*4);
add("stability",S.food<10?-6:(S.food>35?1:0));
if(S.army>90)add("food",-5);else if(S.army>65)add("food",-3);
if(S.stability<=0){S.stability=0;log("Kerusuhan mengguncang ibu kota. Stabilitas kerajaan runtuh.","bad")}
if(S.food===0){add("army",-4);add("stability",-5);log("Kelaparan menyebar. Pasukan dan rakyat mulai kehilangan harapan.","bad")}
if(S.day%3===0){add("xp",8);if(S.xp>=S.level*20){S.xp-=S.level*20;S.level++;add("renown",2);log(`Kepemimpinanmu naik ke level ${S.level}. Reputasi bertambah.`,"good")}}
if(S.day%2===0) randomEvent();
if(S.stability<=0||S.army<=0){S.ending="collapse";modal("Akhir Sebuah Takhta","<p>Kelaparan, perselisihan, dan pemberontakan meruntuhkan Veyr. Para penulis kronik akan memperdebatkan apakah kehancuran itu tak terelakkan.</p>",[{label:"Bangkitkan kerajaan baru",cls:"primary",fn:()=>{S=initial();intro()}}]);return}
if(S.territories.length>=6&&S.stability>=75&&S.renown>=12&&!S.ending){S.ending="unifier";storyEvent("Sang Pemersatu","Enam panji berkibar di bawah lambang Veyr. Untuk pertama kalinya dalam satu abad, para bangsawan berlutut tanpa pedang terhunus.",[{label:"Teruskan pemerintahan",fn:()=>{S.renown+=5;log("Kemenangan pemersatu menjadi awal babak baru.","good")}}])}
}
function randomEvent(){
let events=[
{title:"Karavan Tersesat",text:"Karavan dagang meminta perlindungan setelah disergap di jalan.",choices:[{label:"Kawal karavan (−10 emas, +22 emas)",fn:()=>{if(S.gold>=10){add("gold",12);add("renown",1);log("Karavan tiba dengan selamat. Pedagang memuji nama Veyr.","good")}else{add("stability",-2);log("Kau tak mampu membayar pengawalan.","bad")}}},{label:"Biarkan mereka pergi (+2 bayangan)",fn:()=>{add("shadow",2);log("Karavan menghilang di balik kabut.")}}]},
{title:"Panen yang Baik",text:"Hujan turun tepat waktu dan ladang menghasilkan lebih dari perkiraan.",choices:[{label:"Simpan hasil panen (+25 pangan)",fn:()=>{add("food",25);log("Gudang pangan dipenuhi hasil panen.","good")}},{label:"Bagikan kepada rakyat (+8 stabilitas, +2 renown)",fn:()=>{add("stability",8);add("renown",2);log("Rakyat mengingat kemurahan hatimu.","good")}}]},
{title:"Surat Tanpa Segel",text:"Surat misterius menyebut ruang tersembunyi di bawah benteng lama.",choices:[{label:"Selidiki (−8 emas)",fn:()=>{if(S.gold>=8){add("gold",-8);add("secretClues",1);add("knowledge",1);log("Di balik batu, kau menemukan simbol mahkota hitam.","good")}else{log("Kau tak punya cukup dana untuk penyelidikan.")}}},{label:"Bakar surat (+2 stabilitas)",fn:()=>{add("stability",2);log("Surat dibakar, tetapi rasa ingin tahu tetap tinggal.")}}]},
{title:"Desas-desus Pemberontakan",text:"Seorang kapten mengabarkan bahwa beberapa prajurit tak menerima upah.",choices:[{label:"Bayar mereka (−18 emas, +10 stabilitas)",fn:()=>{if(S.gold>=18){add("gold",-18);add("stability",10);log("Upah dibayarkan dan para prajurit kembali setia.","good")}else{add("stability",-8);log("Upah tak terbayar. Ketidakpuasan membesar.","bad")}}},{label:"Tegakkan disiplin (+5 pasukan, −8 stabilitas)",fn:()=>{add("army",5);add("stability",-8);log("Disiplin dipulihkan dengan tangan besi.","bad")}}]}
];
let e=events[rand(events.length)];log("Peristiwa: "+e.title);storyEvent(e.title,e.text,e.choices)
}
const buildingInfo={
keep:{name:"Benteng",desc:"Meningkatkan stabilitas dan pertahanan.",cost:l=>({gold:45+l*25,wood:25+l*10}),effect:l=>`Stabilitas +${5+l*2} setiap peningkatan`,max:5},
farms:{name:"Lumbung & Ladang",desc:"Menjamin suplai pangan kerajaan.",cost:l=>({gold:30+l*18,wood:20+l*8}),effect:l=>`Produksi pangan +${8+l*4} per hari`,max:5},
barracks:{name:"Barak",desc:"Latih dan perlengkapi pasukan.",cost:l=>({gold:45+l*20,wood:20+l*8,iron:10+l*5}),effect:l=>`Kapasitas & kekuatan pasukan`,max:5},
library:{name:"Perpustakaan",desc:"Membuka riset, pengetahuan, dan petunjuk rahasia.",cost:l=>({gold:55+l*25,wood:25+l*10}),effect:l=>`Riset membuka bonus permanen`,max:3},
spy:{name:"Jaringan Bayangan",desc:"Membuka misi rahasia dan operasi intelijen.",cost:l=>({gold:70+l*30,iron:8+l*5}),effect:l=>`Membuka operasi rahasia`,max:3},
market:{name:"Pasar Kerajaan",desc:"Meningkatkan pendapatan emas setiap hari.",cost:l=>({gold:50+l*25,wood:15+l*10}),effect:l=>`Pendapatan emas +${9+l*5} per hari`,max:4}
};
function build(k){let b=buildingInfo[k],l=S.buildings[k];if(l>=b.max){toast("Bangunan sudah mencapai level maksimum.");return}let c=b.cost(l);if(!costOK(c)){toast("Sumber daya belum cukup.");return}pay(c);S.buildings[k]++;if(k==="keep")add("stability",5+S.buildings[k]*2);if(k==="barracks")add("army",12);if(k==="library"){add("knowledge",1);S.secretClues+=1}log(`${b.name} ditingkatkan ke level ${S.buildings[k]}.`,"good");render()}
function train(){let c={gold:28,food:12,iron:5};if(!costOK(c)){toast("Butuh "+costText(c));return}pay(c);add("army",12+S.buildings.barracks*3);add("xp",3);log("Pasukan baru direkrut dan dilatih.","good");render()}
function research(){if(S.buildings.library===0){toast("Bangun perpustakaan dahulu.");return}let c={gold:25,knowledge:1};if(!costOK(c)){toast("Butuh "+costText(c));return}pay(c);add("knowledge",1);add("xp",8);let r=[["Strategi Logistik","Produksi pangan meningkat."],["Tata Niaga","Pendapatan emas bertambah."],["Benteng Pertahanan","Stabilitas diperkuat."]][rand(3)];if(r[0]==="Strategi Logistik")S.flags.logistics=true;if(r[0]==="Tata Niaga")S.flags.trade=true;if(r[0]==="Benteng Pertahanan")add("stability",8);log("Riset selesai: "+r[0]+". "+r[1],"good");render()}
function explore(){if(S.gold<12||S.army<8){toast("Butuh 12 emas dan 8 pasukan untuk ekspedisi.");return}add("gold",-12);add("army",-3);let r=rand(5);if(r===0){add("gold",40);add("renown",2);log("Ekspedisi menemukan peti upeti yang terlupakan.","good")}else if(r===1){add("secretClues",1);add("knowledge",1);add("shadow",1);log("Di reruntuhan, kau menemukan ukiran mahkota hitam.","good")}else if(r===2){add("wood",25);add("iron",10);log("Ekspedisi menemukan persediaan kayu dan besi.","good")}else if(r===3){add("army",-7);add("xp",8);log("Penyergapan melukai pasukan, tetapi para penyintas membawa peta baru.","bad")}else{add("stability",7);add("renown",1);log("Penduduk desa menyambut pasukanmu dan menawarkan bantuan.","good")}render()}
function diplomacy(name){let c={gold:25};if(!costOK(c)){toast("Diplomasi membutuhkan 25 emas.");return}pay(c);let gain=1+((S.renown>5)?1:0);S.relations[name]=(S.relations[name]||0)+gain;add("renown",1);log(`Utusan kembali dari ${name}. Hubungan membaik (+${gain}).`,"good");if(S.relations[name]>=3&&!S.territories.includes(name)){storyEvent("Perjanjian "+name,`Para pemimpin ${name} menawarkan perjanjian persatuan. Mereka akan bergabung jika kau menunjukkan kekuatan dan kemurahan hati.`,[{label:"Terima perjanjian",fn:()=>{S.territories.push(name);add("stability",5);add("renown",2);log(`${name} bergabung dengan Veyr tanpa pertumpahan darah.`,"good")}},{label:"Tunda keputusan",fn:()=>{add("shadow",1);log("Perjanjian ditunda; para utusan pulang dengan tanda tanya.")}}])}render()}
function conquer(name){let r=regions[name];if(S.territories.includes(name)){toast("Wilayah ini sudah berada di bawah panjimu.");return}if(name==="Duskmoor"){if(S.secretClues<3||S.buildings.spy<1){toast("Petunjuk belum lengkap. Butuh 3 petunjuk dan jaringan bayangan.");return}storyEvent("Gerbang Duskmoor","Di balik gerbang hitam, suara dari masa silam memanggil namamu. Sesuatu di sini mengetahui asal-usul takhtamu.",[{label:"Masuk tanpa pasukan (rahasia)",fn:()=>{S.secretClues++;add("knowledge",3);add("shadow",5);S.flags.dusk=true;log("Kau memasuki Duskmoor dan menemukan silsilah tersembunyi Veyr.","good")}},{label:"Bawa pasukan (−20 pasukan)",fn:()=>{if(S.army>=20){add("army",-20);S.secretClues++;add("knowledge",2);S.flags.dusk=true;log("Pasukan membuka gerbang Duskmoor. Rahasia kerajaan terungkap.","good")}else{log("Pasukanmu tidak cukup untuk ekspedisi.")}}}]);return}
if(!costOK(r.cost)){toast("Butuh "+costText(r.cost));return}let power=S.army+S.buildings.barracks*5+S.level*3;let need=25+r.difficulty*18;if(power<need){toast(`Kekuatan kurang. Perkiraan minimal ${need}; kekuatanmu ${power}.`);return}pay(r.cost);let loss=5+r.difficulty*5+rand(8);add("army",-loss);S.territories.push(name);S.relations[name]=Math.max(0,S.relations[name]||0);add("renown",3);add("stability",-r.difficulty*2);if(name==="The Hollow March")S.secretClues++;log(`${name} kini berada di bawah kendali Veyr. Pasukan kehilangan ${loss} prajurit.`,"good");render()}
function revealSecret(){if(S.secretClues>=3){storyEvent("Silsilah yang Dihapus","Naskah Duskmoor mengungkap bahwa garis keturunan Veyr pernah membuat perjanjian dengan kekuatan yang tak bernama. Bayanganmu bukan sekadar metafora—ia adalah harga dari mahkota itu.",[{label:"Hancurkan naskah (+iman, −bayangan)",fn:()=>{add("faith",15);add("shadow",-8);S.flags.secretEnding="light";S.completed.push("Ending: Penebusan")}},{label:"Pelajari kebenaran (+pengetahuan, +bayangan)",fn:()=>{add("knowledge",5);add("shadow",10);S.flags.secretEnding="dark";S.completed.push("Ending: Pewaris Bayangan")}},{label:"Simpan rahasia (+renown)",fn:()=>{add("renown",5);S.flags.secretEnding="grey";S.completed.push("Ending: Mahkota Kelabu")}}]);}else toast("Kumpulkan 3 petunjuk rahasia terlebih dahulu.");}
function stats(){let arr=[["🪙","Emas",S.gold],["🌾","Pangan",S.food],["🪵","Kayu",S.wood],["⚒","Besi",S.iron],["⚔","Pasukan",S.army],["✧","Iman",S.faith],["♜","Stabilitas",S.stability],["◈","Bayangan",S.shadow]];$("#stats").innerHTML=arr.map(x=>`<div class="stat"><strong>${x[2]}</strong><span>${x[0]} ${x[1]}</span></div>`).join("")+`<div class="stat"><strong>${S.day}</strong><span>☼ Hari · Lv.${S.level}</span></div>`}
function realmView(){let b=Object.entries(buildingInfo).map(([k,v])=>{let l=S.buildings[k],c=v.cost(l);return `<div class="faction"><div class="row"><b>${v.name} <span class="tag">Lv. ${l}/${v.max}</span></b><span class="small">${l>=v.max?"MAKS":costText(c)}</span></div><p>${v.desc}</p><div class="small">${v.effect(l)}</div><button style="width:100%;margin-top:8px" onclick="gameBuild('${k}')" ${l>=v.max||!costOK(c)?"disabled":""}>${l>=v.max?"Maksimum":"Tingkatkan"}</button></div>`}).join("");
return `<div class="banner"><div class="eyebrow">Hari ${S.day} · Level ${S.level} · ${S.title}</div><h1>Takhta Veyr</h1><p>Di antara sumpah, emas, dan rahasia, kerajaanmu tumbuh. Namun setiap keputusan punya harga.</p></div><div class="layout"><div><div class="panel"><h2>Keputusan Hari Ini</h2><p class="small">Aksi utama menghabiskan satu hari. Pilih langkahmu dengan bijak.</p><div class="actions"><button class="action" onclick="gameAction('tick')"><b>☼ Akhiri Hari</b><small>Terima hasil produksi, hadapi konsekuensi dan peristiwa acak.</small></button><button class="action" onclick="gameAction('train')"><b>⚔ Rekrut Pasukan</b><small>Perkuat tentara · 28 emas, 12 pangan, 5 besi.</small></button><button class="action" onclick="gameAction('explore')"><b>🗝 Ekspedisi</b><small>Cari harta, petunjuk rahasia, atau bahaya.</small></button><button class="action" onclick="gameAction('research')"><b>📚 Riset</b><small>Gunakan perpustakaan untuk membuka bonus.</small></button></div></div><div class="panel"><div class="section-title"><h2>Bangunan Kerajaan</h2><span class="tag">Pembangunan</span></div>${b}</div></div><div><div class="panel"><h2>Keadaan Kerajaan</h2>${meterLine("Stabilitas",S.stability,"#82b69a")}${meterLine("Iman",S.faith,"#8da6d9")}${meterLine("Reputasi",Math.min(100,S.renown*5),"#c9a45c")}${meterLine("Pengalaman",S.xp/(S.level*20)*100,"#c9a45c")}<p class="small">Wilayah: ${S.territories.length} · Pengetahuan: ${S.knowledge} · Petunjuk rahasia: ${S.secretClues}/3</p><button style="width:100%" onclick="gameAction('secret')">✦ Selidiki rahasia mahkota</button></div><div class="panel"><h2>Catatan Terakhir</h2><div class="log">${S.log.slice(0,5).map(l=>`<div class="logline"><span class="small">Hari ${l.day}</span><br>${l.text}</div>`).join("")||"Belum ada catatan."}</div></div></div></div>`}
function meterLine(label,v,color){v=Math.max(0,Math.min(100,v));return `<div class="row"><span>${label}</span><span class="small">${Math.round(v)}/100</span></div><div class="meter"><i style="width:${v}%;background:${color}"></i></div>`}
function mapView(){return `<div class="panel"><div class="eyebrow">The Seven Banners</div><h2>Wilayah dan Panji</h2><p>Perluas kerajaan melalui diplomasi atau penaklukan. Wilayah baru menambah produksi harian.</p>${names.map(n=>{let r=regions[n],owned=S.territories.includes(n),rel=S.relations[n]||0;return `<div class="faction"><div class="row"><b>${owned?"♜":n==="Duskmoor"?"◈":"⚑"} ${n}</b><span class="tag">${owned?"DIKUASAI":n==="Duskmoor"?"TERSEMBUNYI":`Relasi ${rel}`}</span></div><p>${r.desc}</p>${owned?`<div class="small good">Wilayah ini menyumbang hasil kerajaan.</div>`:n==="Duskmoor"?`<div class="small">Syarat: 3 petunjuk rahasia + jaringan bayangan.</div><button style="width:100%;margin-top:8px" onclick="gameAction('conquer','${n}')">Buka jalur rahasia</button>`:`<div class="small">Diplomasi: 25 emas · Penaklukan: ${costText(r.cost)} · Tantangan ${r.difficulty}/4</div><div class="row" style="margin-top:8px"><button onclick="gameAction('diplo','${n}')">🤝 Diplomasi</button><button onclick="gameAction('conquer','${n}')">⚔ Taklukkan</button></div>`}</div>`}).join("")}</div>`}
function courtView(){let factions=[["House Cinderfall","Lord Kael","Mereka menguasai besi dan mengagumi kekuatan.",S.relations.Cinderfall,"Cinderfall"],["House Silvermere","Lady Maerwynn","Mereka menjaga iman dan arsip kuno.",S.relations.Silvermere,"Silvermere"],["Order of Thornwatch","Marshal Edrin","Mereka setia pada perbatasan, bukan pada mahkota.",S.relations.Thornwatch,"Thornwatch"],["Ember Coast Guild","Master Soren","Mereka percaya setiap sumpah memiliki harga.",S.relations["Ember Coast"],"Ember Coast"]];return `<div class="panel"><div class="eyebrow">The royal court</div><h2>Dewan Para Bangsawan</h2><p>Hubungan baik membuka perjanjian tanpa perang. Setiap utusan membutuhkan 25 emas untuk perjalanan dan hadiah.</p>${factions.map(f=>`<div class="faction"><div class="row"><b>${f[0]}</b><span class="tag">Relasi ${f[3]||0}</span></div><div class="gold">${f[1]}</div><p>${f[2]}</p><button onclick="gameAction(&quot;diplo&quot;,&quot;${f[4]}&quot;)">Kirim utusan (25 emas)</button></div>`).join("")}<div class="faction"><b>🕯 Dewan Bayangan</b><p>Informasi adalah senjata. Operasi rahasia bisa mengungkap petunjuk atau menimbulkan kecurigaan.</p><button onclick="gameAction('spy')">Jalankan operasi rahasia</button></div></div>`}
function questsView(){let q=questDefs.map(d=>{let done=S.completed.includes(d.id),ready=d.check();return `<div class="quest"><div class="row"><b>${d.secret?"◈ ":"✦ "}${d.title}</b><span class="tag">${done?"SELESAI":ready?"SIAP DIKLAIM":d.secret?"RAHASIA":"AKTIF"}</span></div><p>${d.secret&&!S.flags.revealed&&!done?"Catatan ini dikunci oleh tinta hitam. Bangun jaringan bayangan untuk membuka petunjuk.":d.desc}</p><div class="small">${d.secret&&!S.flags.revealed?"Syarat tersembunyi":d.goal}</div>${!done?`<button style="margin-top:8px" onclick="gameAction('quest','${d.id}')" ${!ready?"disabled":""}>${ready?"Klaim hadiah":"Belum terpenuhi"}</button>`:`<div class="good small">Hadiah telah diklaim.</div>`}</div>`}).join("");return `<div class="panel"><div class="eyebrow">Chronicles & ambitions</div><h2>Misi Kerajaan</h2><p>Selesaikan tujuan untuk mendapat emas, reputasi, dan membuka cerita tersembunyi.</p>${q}<div class="quest"><b>✧ Tujuan utama: Satukan panji</b><p>Kuasai atau persatukan enam wilayah, pertahankan stabilitas, dan tentukan warisanmu.</p><div class="meter"><i style="width:${Math.min(100,(S.territories.length-1)/5*100)}%"></i></div><span class="small">${S.territories.length-1}/5 wilayah tambahan</span></div></div>`}
function chronicleView(){return `<div class="panel"><div class="eyebrow">The ink remembers</div><h2>Kronik Kerajaan</h2><p>Segala keputusan dicatat di sini. Sejarah Veyr ditulis oleh kemenangan, kompromi, dan rahasia.</p><div class="row"><span class="tag">${S.log.length} catatan</span><button onclick="gameAction('export')">Ekspor kronik</button></div><div class="log" style="max-height:none">${S.log.map(l=>`<div class="logline"><span class="gold">Hari ${l.day}</span><br>${l.text}</div>`).join("")||'<div class="empty">Kronik masih kosong.</div>'}</div><hr style="border-color:var(--line);margin:18px 0"><h3>Warisanmu</h3><p>Level ${S.level} · ${S.territories.length} wilayah · ${S.renown} reputasi · ${S.secretClues} petunjuk rahasia</p>${S.flags.secretEnding?`<p class="gold">Jalur rahasia: ${S.flags.secretEnding==="light"?"Penebusan":S.flags.secretEnding==="dark"?"Pewaris Bayangan":"Mahkota Kelabu"}</p>`:"" }<button class="danger" onclick="gameAction('reset')">Mulai kerajaan baru</button></div>`}
function render(){stats();const hl=document.getElementById("heroLevel");if(hl)hl.textContent=S.level||1;let tab=$("#tabs .active")?.dataset.tab||"realm";$("#view").innerHTML=tab==="realm"?realmView():tab==="map"?mapView():tab==="court"?courtView():tab==="quests"?questsView():chronicleView();$("#tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
window.gameBuild=build;
window.gameAction=(a,arg)=>{
if(a==="tick"){tick();if(!S.ending)eventStory();render()}
if(a==="train"){train();render()}
if(a==="explore"){explore()}
if(a==="research"){research()}
if(a==="secret"){revealSecret()}
if(a==="diplo"){diplomacy(arg)}
if(a==="conquer"){conquer(arg);render()}
if(a==="spy"){if(S.buildings.spy<1){toast("Bangun Jaringan Bayangan terlebih dahulu.");return}if(S.gold<18){toast("Butuh 18 emas.");return}add("gold",-18);let r=rand(4);if(r===0){add("secretClues",1);add("knowledge",1);log("Mata-mata menemukan petunjuk tentang Duskmoor.","good")}else if(r===1){add("renown",2);add("shadow",2);log("Informasi rahasia memberi keunggulan diplomatik.","good")}else if(r===2){add("gold",35);log("Jaringanmu menggagalkan penyelundupan dan menyita emas.","good")}else{add("stability",-5);add("shadow",4);log("Seorang mata-mata tertangkap. Kecurigaan menyebar.","bad")}render()}
if(a==="quest"){let q=questDefs.find(x=>x.id===arg);if(!q||S.completed.includes(arg)||!q.check())return;S.completed.push(arg);let rewards={bread:{gold:25,stability:5},whisper:{knowledge:2,secretClues:1},oldscript:{faith:8,renown:2},unity:{gold:40,renown:3},crown:{gold:60,renown:5,knowledge:3}};Object.entries(rewards[arg]||{}).forEach(([k,v])=>add(k,v));if(arg==="whisper")S.flags.revealed=true;log("Misi selesai: "+q.title+". Hadiah diterima.","good");toast("Misi selesai! Hadiah diterima.");render()}
if(a==="export"){let t=S.log.slice().reverse().map(l=>`Hari ${l.day}: ${l.text}`).join("\n");let blob=new Blob([`KRONIK KERAJAAN VEYR\nHari ${S.day}\n\n${t}`],{type:"text/plain"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="kronik-kingdom-of-shadows.txt";a.click();URL.revokeObjectURL(url)}
if(a==="reset")modal("Tinggalkan Takhta?","<p>Seluruh progres lokal akan diganti dengan kerajaan baru. Pastikan kamu benar-benar ingin memulai ulang.</p>",[{label:"Batalkan"},{label:"Mulai ulang",cls:"danger",fn:()=>{S=initial();localStorage.removeItem("kos_save_v1");log("Kisah baru dimulai.");intro();render()}}])
};
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button[data-tab]");if(!b)return;$("#tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});
$("#saveBtn").onclick=save;$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").classList.add("hidden")});
S=load()||initial();if(!S.flags.started){log("Malam turun di Veyr. Sebuah segel menunggu pemiliknya.");setTimeout(intro,250)}else{log("Kau kembali ke takhta. Kerajaan menunggu perintahmu.");}render();
})();
</script></body></html>
